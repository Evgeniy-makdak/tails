name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          EXPO_PUBLIC_CHAT_LIVE: '1'
          # Public Tailio chat API (https://…). Set repo secret CHAT_API_URL for GitHub Pages.
          # Without it the build still succeeds; chat will show a connection error until the secret is set.
          EXPO_PUBLIC_API_URL: ${{ secrets.CHAT_API_URL }}
        run: npm run build:web

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
