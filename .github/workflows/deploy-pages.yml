name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve public chat API
        id: chat
        env:
          CHAT_API_URL: ${{ vars.CHAT_API_URL }}
        run: |
          if [ -n "$CHAT_API_URL" ] && ! echo "$CHAT_API_URL" | grep -q 'localhost'; then
            echo "live=1" >> "$GITHUB_OUTPUT"
            echo "url=$CHAT_API_URL" >> "$GITHUB_OUTPUT"
            echo "Using public chat API: $CHAT_API_URL"
          else
            echo "live=0" >> "$GITHUB_OUTPUT"
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "No CHAT_API_URL variable — Pages will ship demo chat (set Variable for live)."
          fi

      - name: Build web app
        env:
          EXPO_PUBLIC_CHAT_LIVE: ${{ steps.chat.outputs.live }}
          EXPO_PUBLIC_API_URL: ${{ steps.chat.outputs.url }}
        run: |
          npm run build:web
          if [ "$EXPO_PUBLIC_CHAT_LIVE" = "1" ]; then
            if ! grep -R -F "$EXPO_PUBLIC_API_URL" dist/_expo >/dev/null; then
              echo "::error::API URL was not inlined into the bundle"
              exit 1
            fi
          fi

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
