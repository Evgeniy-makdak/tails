name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          EXPO_PUBLIC_CHAT_LIVE: '1'
          # Prefer repo secret CHAT_API_URL (stable host). Fallback: temporary HTTPS tunnel to local :8787
          # (keep `npm run chat:server` + SSH tunnel alive while testing Pages from phones/other PCs).
          EXPO_PUBLIC_API_URL: ${{ secrets.CHAT_API_URL != '' && secrets.CHAT_API_URL || 'https://561a9228fef7fa.lhr.life' }}
        run: npm run build:web

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
