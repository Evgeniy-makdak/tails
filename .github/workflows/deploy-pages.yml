name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          EXPO_PUBLIC_CHAT_LIVE: '1'
          # Public HTTPS API for Pages (must not be localhost — mixed content + remote devices).
          # Prefer repo Variable CHAT_API_URL (Settings → Variables). Fallback = temporary tunnel.
          EXPO_PUBLIC_API_URL: ${{ vars.CHAT_API_URL || 'https://a9ade3f8a05951.lhr.life' }}
        run: |
          echo "Building with API: $EXPO_PUBLIC_API_URL"
          if echo "$EXPO_PUBLIC_API_URL" | grep -q 'localhost'; then
            echo "Refusing to bake localhost API into Pages build"
            exit 1
          fi
          npm run build:web
          if grep -R "localhost:8787" dist/_expo dist/index.html 2>/dev/null; then
            echo "localhost:8787 leaked into dist"
            exit 1
          fi
          grep -R "a9ade3f8a05951.lhr.life\|CHAT_API\|lhr.life\|trycloudflare\|railway\|onrender\|fly.dev" dist/_expo -l | head -5 || true

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
