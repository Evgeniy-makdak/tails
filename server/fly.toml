# Deploy: cd server && flyctl launch --copy-config --name tailio-chat --region ams
# Persistent chat DB: flyctl volumes create tailio_data --region ams --size 1
app = "tailio-chat"
primary_region = "ams"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  TAILIO_DB_PATH = "/data/tailio.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "tailio_data"
  destination = "/data"
